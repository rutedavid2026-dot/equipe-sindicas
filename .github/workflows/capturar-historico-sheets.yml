name: Capturar histórico semanal (Notion -> Sheets)

on:
  schedule:
    # A cada 3h, o dia inteiro — rede de segurança pro webhook do Notion
    # (src/routes/webhooks/notion.ts), que já ficou mudo por mais de um dia
    # sem avisar ninguém (2026-09-19 e de novo 2026-09-25→27, confirmado
    # comparando last_edited_time do Notion com o _webhook_log: edições reais
    # sem nenhum evento correspondente). Webhook funcionando = essa captura
    # roda em cima de dados já atualizados e não faz diferença. Webhook
    # mudo = a fotografia da semana nunca fica mais de ~3h desatualizada, em
    # vez de até uma semana inteira (antes disso, o único fallback era a
    # captura semanal de sexta abaixo). Sem custo extra: cada rodada só lê o
    # que muda no Notion, não regrava história antiga.
    - cron: "0 */3 * * *"
    # Mantida como redundância explícita (não faz mal rodar 2x no mesmo
    # horário) — se algum dia a cadência de 3h for reduzida, isso garante
    # que pelo menos uma captura por semana continua garantida.
    - cron: "0 11 * * 5"
  workflow_dispatch:
    inputs:
      condominio:
        description: "Slug/id ou nome exato (opcional) — processa só esse condomínio. Vazio = todos."
        required: false
        type: string

jobs:
  capturar:
    runs-on: ubuntu-latest
    # Fila por condomínio (ou "todos", pro cron/disparo sem filtro): se uma
    # edição nova chegar enquanto a captura anterior do MESMO condomínio
    # ainda está rodando, cancela a antiga e assume o lugar — a mais nova
    # sempre busca o estado atual completo do Notion, então nada se perde.
    # Isso troca o antigo debounce "descarta se recente" (que perdia
    # atualização quando a síndica editava de novo dentro da janela) por uma
    # fila que sempre converge pro estado mais recente, sem depender de uma
    # nova edição pra "destravar". Condomínios diferentes têm grupos
    # diferentes — rodam em paralelo, sem se bloquear.
    concurrency:
      group: capturar-${{ github.event.inputs.condominio || 'todos' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/capturar-historico-sheets.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_API_KEY_2: ${{ secrets.NOTION_API_KEY_2 }}
          CONDOMINIO_FILTRO: ${{ inputs.condominio }}
